<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula06 css-interno</title>
    <style>
        .titulo{
            color: darkblue;
            text-align: center;

        }

        .caixa01{
            background-color: aqua;
            border: 2px solid black;
            padding: 20px;
            margin: 20px;

        }

        .caixa02{
            background-color: rgb(21, 255, 0);
            border: 2px solid black;
            padding: 20px;
            margin: 20px;

        }

        .destaque01{
            color: rgb(89, 0, 255);
            font-weight: bold;

        }

        .destaque02{
            color: red;
            background-color: aliceblue;
            font-style: italic;
            padding: 10px;

        }

        
    </style>
</head>
<body>
    <h1 class="titulo">
        Aprendendo classes em CSS
    </h1>
    <div class="caixa01">
        <p>
            Aprendendo a utilizar classe para personalizar os elementos da pág.
        </p>
        <br>
        <p class="destaque01">
            Este paragrafo utiliza a classe de destaque01
        </p>
        <p class="destaque02">
            Este paragrafo utiliza a classe de destaque02
        </p>
    </div>
    <div class="caixa02">
        <p>
            Este paragrafo não utiliza nenhuma classe
        </p>
    </div>
</body>
</html>
