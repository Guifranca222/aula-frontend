<!doctype html>

<html lang="pt-BR">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>JavaScript no head e no body</title>


    <script src="script.js" defer></script>
  </head>
  <style>
    .destaque{
      color: blue;
      font-size: large;
      font-weight: bold;

    }
  </style>

  <script>
    alert("O JavasCript do cabeçalho foi executado!");
  </script>
  
  
  <body>
    <h1>
      JavaScript incorporado
    </h1>
    <p class="destaque">
      Este conteúdo foi escrito diretamente no HTML!
    </p>
    <script>
      document.write(
        '<p class="destaque">Este conteúdo foi escrito diretamente no JavaScript!</p>',
      );
    </script>

  </body>
</html>
